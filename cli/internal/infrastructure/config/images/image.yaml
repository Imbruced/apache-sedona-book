images:
  postgis:
    name: postgis/postgis:17-3.5-alpine
    command: ["postgres", "-c", "wal_level=logical"]
  thriftserver:
    name: thriftserver:1.0
    show-in-browser: false
    container-name: thriftserver
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
  sedonadbt:
    name: sedonadbt:1.0
    show-in-browser: true
    browser-open-path: http://localhost:8888/lab/tree/geospatialdbt/TransformingYourGeospatialDataWithDBT.ipynb
    container-name: sedonadbt
    mount-path: /opt/workspace
    health-check:
      test: [ "CMD-SHELL", "curl -f http://localhost:8888/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8888:8888"
  sedona:
    name: apache/sedona:1.7.1
    container-name: sedona-jupyter
    mount-path: /opt/workspace
    show-in-browser: true
    browser-open-path: http://localhost:8888/lab/tree
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
      - "8888:8888"
    health-check:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
  sedona-ai:
    name: sedona-ai
    container-name: sedona-ai
    mount-path: /home/ubuntu/sedona-ai
    show-in-browser: true
    browser-open-path: http://localhost:8888/lab/tree
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
      - "8888:8888"
    health-check:
      test: [ "CMD-SHELL", "curl -f http://localhost:8888/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    name: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    container-name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sedona
      MINIO_ROOT_PASSWORD: sedona_password
    health-check:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mount-path: /app/sources
